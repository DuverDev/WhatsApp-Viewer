name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        env:
          # PyInstaller con su arranque (bootloader) compilado aquí, no el precompilado del paquete:
          # el precompilado lo comparten muchos programas y los antivirus por IA lo marcan.
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel
          pip install --no-binary pyinstaller --no-cache-dir "pyinstaller==6.22.3"
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build executable
        shell: cmd
        run: build.bat

      - name: Extract version
        id: meta
        shell: pwsh
        run: |
          $raw = Get-Content version_info.py -Raw -Encoding UTF8
          $m = [regex]::Match($raw, 'VERSION\s*=\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)')
          if (-not $m.Success) { throw "Could not find VERSION in version_info.py" }
          $version = "$($m.Groups[1].Value).$($m.Groups[2].Value).$($m.Groups[3].Value)"
          $tag = "v$version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whatsapp-viewer-${{ steps.meta.outputs.tag }}
          path: |
            dist/WhatsApp Viewer.exe
            dist/WhatsApp Viewer.exe.sha256
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump VERSION in version_info.py instead of replacing a published release." }

          $exeFile = "dist\WhatsApp Viewer.exe"
          $files = @($exeFile)
          $exeHash = (Get-FileHash $exeFile -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashes = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$(Split-Path $f -Leaf)" | Set-Content "$f.sha256" -Encoding ascii -NoNewline
            "- ``$(Split-Path $f -Leaf)``: ``$hash``"
          }

          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for $version" }

          @"
          $($m.Groups[1].Value.Trim())

          ### Descargas / Downloads
          | Archivo | Para qué |
          |---|---|
          | ``WhatsApp Viewer.exe`` | Ejecutable portátil único para Windows x64. |

          **SHA-256** (también en ``.sha256``)
          $($hashes -join "`n")

          - **VirusTotal (`.exe`):** https://www.virustotal.com/gui/file/$exeHash

          Requisitos: Windows 10 / 11 x64 (Microsoft Edge WebView2 Runtime incluido).
          "@ | Set-Content notes.md -Encoding utf8

          $sha = git rev-parse HEAD
          $assets = $files + ($files | ForEach-Object { "$_.sha256" })
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $sha --title "WhatsApp Backup Viewer $version" --notes-file notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed" }
