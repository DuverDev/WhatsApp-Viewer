name: CI

on:
  push:
    branches: [ main, 'rediseño-ui-local' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        env:
          # PyInstaller con su arranque (bootloader) compilado aquí, no el precompilado del paquete:
          # el precompilado lo comparten muchos programas y los antivirus por IA lo marcan.
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip wheel
          pip install --no-binary pyinstaller --no-cache-dir "pyinstaller==6.22.3"
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Windows executable
        shell: cmd
        run: build.bat

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whatsapp-viewer-win-x64
          path: |
            dist/WhatsApp Viewer.exe
            dist/WhatsApp Viewer.exe.sha256
          if-no-files-found: error
